name: Form Shield
slug: form-shield
type: plugin
version: 1.0.2
description: Adds local, layered spam protection to Grav forms.
icon: shield
author:
  name: Digitalfaktor Services
  url: https://www.digitalfaktor.at
homepage: https://github.com/digitalfaktor/grav-plugin-form-shield
bugs: https://github.com/digitalfaktor/grav-plugin-form-shield/issues
keywords: form, spam, captcha, privacy
license: MIT
compatibility:
  grav: ['2.0']

dependencies:
  - { name: grav, version: '>=2.0.0' }
  - { name: form, version: '>=9.1.23' }
  - { name: php, version: '>=8.1' }

form:
  validation: strict
  fields:
    general_section:
      type: section
      title: PLUGIN_FORM_SHIELD.GENERAL
      underline: true
      fields:
        enabled:
          type: toggle
          label: PLUGIN_FORM_SHIELD.PLUGIN_STATUS
          highlight: 1
          default: 1
          options:
            1: PLUGIN_FORM_SHIELD.ENABLED
            0: PLUGIN_FORM_SHIELD.DISABLED
          validate:
            type: bool

        routes:
          type: array
          value_only: true
          label: PLUGIN_FORM_SHIELD.PROTECTED_FORM_ROUTES
          help: PLUGIN_FORM_SHIELD.PROTECTED_FORM_ROUTES_HELP
          placeholder_value: /contact
          validate:
            type: array

    captcha_section:
      type: section
      title: PLUGIN_FORM_SHIELD.HONEYPOT_AND_CAPTCHA
      underline: true
      fields:
        honeypot.enabled:
          type: toggle
          label: PLUGIN_FORM_SHIELD.ENABLE_HONEYPOT
          help: PLUGIN_FORM_SHIELD.ENABLE_HONEYPOT_HELP
          highlight: 1
          default: 1
          options:
            1: PLUGIN_FORM_SHIELD.ENABLED
            0: PLUGIN_FORM_SHIELD.DISABLED
          validate:
            type: bool

        captcha.enabled:
          type: toggle
          label: PLUGIN_FORM_SHIELD.ENABLE_LOCAL_CAPTCHA
          help: PLUGIN_FORM_SHIELD.ENABLE_LOCAL_CAPTCHA_HELP
          highlight: 1
          default: 1
          options:
            1: PLUGIN_FORM_SHIELD.ENABLED
            0: PLUGIN_FORM_SHIELD.DISABLED
          validate:
            type: bool

        captcha.mode:
          type: select
          label: PLUGIN_FORM_SHIELD.CAPTCHA_MODE
          default: invisible
          options:
            invisible: PLUGIN_FORM_SHIELD.CAPTCHA_MODE_INVISIBLE
            checkbox: PLUGIN_FORM_SHIELD.CAPTCHA_MODE_CHECKBOX
          validate:
            type: text

    time_section:
      type: section
      title: PLUGIN_FORM_SHIELD.TIMING_CHECK
      underline: true
      fields:
        time_check.enabled:
          type: toggle
          label: PLUGIN_FORM_SHIELD.ENABLE_TIMING_CHECK
          help: PLUGIN_FORM_SHIELD.ENABLE_TIMING_CHECK_HELP
          highlight: 1
          default: 1
          options:
            1: PLUGIN_FORM_SHIELD.ENABLED
            0: PLUGIN_FORM_SHIELD.DISABLED
          validate:
            type: bool

        time_check.minimum_seconds:
          type: number
          label: PLUGIN_FORM_SHIELD.MINIMUM_TIME
          default: 5
          validate:
            type: number
            min: 0
            max: 60

    rate_section:
      type: section
      title: PLUGIN_FORM_SHIELD.RATE_LIMIT
      underline: true
      fields:
        rate_limit.enabled:
          type: toggle
          label: PLUGIN_FORM_SHIELD.ENABLE_RATE_LIMIT
          help: PLUGIN_FORM_SHIELD.ENABLE_RATE_LIMIT_HELP
          highlight: 1
          default: 1
          options:
            1: PLUGIN_FORM_SHIELD.ENABLED
            0: PLUGIN_FORM_SHIELD.DISABLED
          validate:
            type: bool

        rate_limit.maximum_attempts:
          type: number
          label: PLUGIN_FORM_SHIELD.MAXIMUM_SUBMISSIONS
          default: 3
          validate:
            type: number
            min: 1
            max: 100

        rate_limit.window_seconds:
          type: number
          label: PLUGIN_FORM_SHIELD.TIME_WINDOW
          default: 600
          validate:
            type: number
            min: 60
            max: 86400

    response_section:
      type: section
      title: PLUGIN_FORM_SHIELD.SECURITY_FAILURE_RESPONSE
      underline: true
      fields:
        failure_response.mode:
          type: select
          label: PLUGIN_FORM_SHIELD.RESPONSE_MODE
          help: PLUGIN_FORM_SHIELD.RESPONSE_MODE_HELP
          default: message
          options:
            silent: PLUGIN_FORM_SHIELD.RESPONSE_MODE_SILENT
            message: PLUGIN_FORM_SHIELD.RESPONSE_MODE_MESSAGE
          validate:
            type: text

        failure_response.message:
          type: text
          label: PLUGIN_FORM_SHIELD.FAILURE_MESSAGE_LABEL
          help: PLUGIN_FORM_SHIELD.FAILURE_MESSAGE_HELP
          placeholder: PLUGIN_FORM_SHIELD.FAILURE_MESSAGE
          size: large
          validate:
            type: text
